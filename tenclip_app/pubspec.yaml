publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  http_parser: ^4.1.2
  image_picker: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  video_player: ^2.9.5
  url_launcher: ^6.3.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  webview_flutter: ^4.10.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  share_plus: ^10.1.2
  gal: ^2.3.1
  intl: ^0.20.2
  video_compress: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

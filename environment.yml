# Conda 环境：Python + ffmpeg（MoviePy 更稳），其余用 pip 与 requirements 对齐。
# 创建：conda env create -f environment.yml
# 已存在时更新：conda env update -f environment.yml --prune
name: tenclip
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.13
  - pip
  - ffmpeg
  - pip:
      - -r requirements.txt
      - -r requirements-llm.txt
      - -r requirements-llm-lf.txt

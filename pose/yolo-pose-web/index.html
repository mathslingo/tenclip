<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>YOLO Pose · ONNX Runtime Web</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 12px 28px;
    }
    h1 {
      margin: 4px 0 14px;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .actions button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.92rem;
      font-weight: 600;
      color: #fff;
      background: #2f6bff;
      cursor: pointer;
      flex: 1 1 auto;
      min-width: calc(33% - 8px);
    }
    .actions button:active { opacity: 0.85; }
    .actions button:disabled { opacity: 0.45; }
    #fileInput { display: none; }
    #status {
      margin: 0 0 4px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: #222;
      min-height: 1.4em;
    }
    #metrics {
      margin: 0 0 10px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: #1a7f37;
      font-weight: 600;
      min-height: 1.4em;
    }
    .stage {
      width: 100%;
      background: #f3f3f3;
      border-radius: 4px;
      overflow: hidden;
      line-height: 0;
    }
    #canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #111;
      min-height: 180px;
    }
    video { display: none; }
    .tips {
      margin-top: 14px;
      font-size: 0.82rem;
      line-height: 1.55;
      color: #444;
    }
    .tips code {
      font-size: 0.8em;
      background: #f0f0f0;
      padding: 1px 4px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>YOLO Pose · ONNX Runtime Web</h1>

    <div class="actions">
      <button id="camBtn" type="button">开始摄像头</button>
      <button id="pickBtn" type="button">选择图片</button>
      <button id="busBtn" type="button">跑测试图(bus.jpg)</button>
    </div>
    <input id="fileInput" type="file" accept="image/*" />

    <p id="status">正在加载模型…</p>
    <p id="metrics"></p>

    <div class="stage">
      <video id="video" playsinline webkit-playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>

    <p class="tips">
      iPhone Safari：请用 <strong>HTTPS</strong>（或本机 localhost）。须点击「开始摄像头」授权。
      摄像头帧率上限约 30。模型输入 <strong id="imgszTip">640×640</strong>，约 13.5MB；
      同源加载后写入 <strong>IndexedDB</strong>，下次几乎秒开。
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>

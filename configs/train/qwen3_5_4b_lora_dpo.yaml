### model
# 4B 适配 6GB 级显存；DPO 同时载入策略/参考模型，开启 4bit QLoRA-DPO
# 显存更小可换 2B：model/Qwen3.5-2B-Instruct
model_name_or_path: model/Qwen3.5-4B-Instruct
trust_remote_code: true
quantization_bit: 4
quantization_method: bnb

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
pref_beta: 0.1
pref_loss: sigmoid

### dataset
dataset_dir: data
dataset: mock_tennis_dpo_10k
template: qwen3_5
cutoff_len: 2048
max_samples: 10000
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
output_dir: saves/qwen3_5_4b/lora/dpo
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
resume_from_checkpoint: null
